[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "real-time-bp"
version = "0.0.1"
description = "A Physics-Aware Carrier Tracking System for Ionospheric Scintillation Mitigation and Monitoring"
authors = [
  { name = "Rodrigo Florindo" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "dvc>=3.67.1",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "kagglehub>=1.0.1",
    "keras>=3.14.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pip",
    "plotly>=6.8.0",
    "pre-commit>=4.6.0",
    "prox-tv",
    "pydynamic>=2.5.1",
    "pytest",
    "python-dotenv",
    "ruff",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "tensorflow[and-cuda]>=2.21.0",
    "tqdm>=4.67.3",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["real_time_bp"]
include = ["pyproject.toml", "real_time_bp/**/*.py"]

[tool.ruff.lint]
extend-select = ["D", "I"]  # Add Google docstring checks and import sorting.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["real_time_bp"]
force-sort-within-sections = true
