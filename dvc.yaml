stages:
  get_dataset:
    cmd: uv run python -m real_time_bp.scripts.get_dataset
    params:
      - dataset.handle
      - dataset.output_dir
      - dataset.force_download
    outs:
      - data/raw/backpropagation
    always_changed: false

  dataset_summary:
    cmd: uv run python -m real_time_bp.scripts.get_dataset_summary
    deps:
      - real_time_bp/__init__.py
      - real_time_bp/config.py
      - real_time_bp/scripts/get_dataset_summary.py
      - real_time_bp/utils/stage.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - data/raw/backpropagation
    params:
      - dataset
      - constants
      - experiments
    outs:
      - outputs/01_dataset

  filter_bank_results:
    cmd: uv run python -m real_time_bp.scripts.get_filter_bank_results
    deps:
      - real_time_bp/__init__.py
      - real_time_bp/config.py
      - real_time_bp/scripts/get_filter_bank_results.py
      - real_time_bp/utils/stage.py
      - real_time_bp/methodology/backpropagation.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/methodology/metrics.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/methodology/tvd.py
      - real_time_bp/utils/representatives.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/output_rows.py
      - real_time_bp/utils/parallel.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - real_time_bp/utils/quality.py
      - data/raw/backpropagation
    params:
      - dataset
      - runtime
      - constants
      - experiments
      - quality_control
      - tvd
    outs:
      - outputs/03_filter_bank/filter_bank_score_curves.csv
      - outputs/03_filter_bank/filter_bank_estimates.csv
      - outputs/03_filter_bank/filter_bank_downstream_phase_metrics.csv
      - outputs/03_filter_bank/filter_bank_tf_error_metrics.csv
      - outputs/03_filter_bank/filter_bank_downstream_summary.csv
      - outputs/03_filter_bank/filter_bank_n_init_sensitivity.csv
      - outputs/03_filter_bank/filter_bank_boxplot_estimates.csv

  sliding_results:
    cmd: uv run python -m real_time_bp.scripts.get_sliding_results
    deps:
      - real_time_bp/__init__.py
      - real_time_bp/config.py
      - real_time_bp/scripts/get_sliding_results.py
      - real_time_bp/scripts/sliding/common.py
      - real_time_bp/scripts/sliding/examples.py
      - real_time_bp/scripts/sliding/metrics.py
      - real_time_bp/utils/stage.py
      - real_time_bp/methodology/backpropagation.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/methodology/metrics.py
      - real_time_bp/methodology/sliding.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/methodology/tvd.py
      - real_time_bp/utils/representatives.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/output_rows.py
      - real_time_bp/utils/parallel.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - real_time_bp/utils/quality.py
      - data/raw/backpropagation
      - outputs/03_filter_bank/filter_bank_estimates.csv
    params:
      - dataset
      - runtime
      - constants
      - experiments
      - sliding.var_order_min
      - sliding.var_order_max
      - sliding.practical_fft_m
      - sliding.practical_latency_samples
      - sliding.forecast_example_c_n0_db_hz
      - sliding.forecast_example_block_len
      - sliding.forecast_example_latency_samples
      - quality_control
      - tvd
    outs:
      - outputs/04_sliding/sliding_var_orders.csv
      - outputs/04_sliding/sliding_practical_metrics.csv
      - outputs/04_sliding/sliding_forecast_example.csv

  sliding_heatmap:
    cmd: uv run python -m real_time_bp.scripts.get_sliding_heatmap
    deps:
      - real_time_bp/__init__.py
      - real_time_bp/config.py
      - real_time_bp/scripts/get_sliding_heatmap.py
      - real_time_bp/scripts/sliding/common.py
      - real_time_bp/scripts/sliding/heatmap.py
      - real_time_bp/utils/stage.py
      - real_time_bp/methodology/backpropagation.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/methodology/metrics.py
      - real_time_bp/methodology/sliding.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/methodology/tvd.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/parallel.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - real_time_bp/utils/quality.py
      - real_time_bp/utils/representatives.py
      - data/raw/backpropagation
      - outputs/03_filter_bank/filter_bank_estimates.csv
    params:
      - dataset
      - runtime
      - constants
      - experiments
      - sliding.var_order_min
      - sliding.var_order_max
      - sliding.fft_m_values
      - sliding.heatmap_latency_fractions
      - sliding.heatmap_cases_per_severity
      - quality_control
      - tvd
    outs:
      - outputs/04_sliding/sliding_latency_heatmap.csv

  representative_results:
    cmd: uv run python -m real_time_bp.scripts.get_representative_results
    deps:
      - real_time_bp/__init__.py
      - real_time_bp/config.py
      - real_time_bp/scripts/get_representative_results.py
      - real_time_bp/scripts/cycle_slips.py
      - real_time_bp/scripts/get_filter_bank_results.py
      - real_time_bp/scripts/sliding/common.py
      - real_time_bp/scripts/sliding/examples.py
      - real_time_bp/scripts/sliding/metrics.py
      - real_time_bp/utils/stage.py
      - real_time_bp/methodology/backpropagation.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/methodology/metrics.py
      - real_time_bp/methodology/sliding.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/methodology/tvd.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/output_rows.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - real_time_bp/utils/quality.py
      - real_time_bp/utils/representatives.py
      - data/raw/backpropagation
      - outputs/03_filter_bank/filter_bank_estimates.csv
    params:
      - dataset
      - runtime
      - constants
      - experiments
      - sliding.var_order_min
      - sliding.var_order_max
      - sliding.practical_fft_m
      - sliding.practical_latency_samples
      - sliding.example_ml_configs
      - quality_control
      - representatives
      - tvd
    outs:
      - outputs/02_cycle_slips/tvd_example_traces.csv
      - outputs/03_filter_bank/filter_bank_representative_score_curves.csv
      - outputs/03_filter_bank/filter_bank_representative_phase_traces.csv
      - outputs/04_sliding/sliding_phase_example.csv

  result_plots:
    cmd: uv run python -m real_time_bp.plots.main
    deps:
      - real_time_bp/__init__.py
      - real_time_bp/config.py
      - real_time_bp/plots/common.py
      - real_time_bp/plots/cycle_slips.py
      - real_time_bp/plots/filter_bank.py
      - real_time_bp/plots/main.py
      - real_time_bp/plots/sliding.py
      - real_time_bp/utils/plot_style.py
      - real_time_bp/utils/representatives.py
      - real_time_bp/utils/stage.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - outputs/02_cycle_slips/tvd_example_traces.csv
      - outputs/03_filter_bank/filter_bank_representative_phase_traces.csv
      - outputs/03_filter_bank/filter_bank_representative_score_curves.csv
      - outputs/03_filter_bank/filter_bank_boxplot_estimates.csv
      - outputs/03_filter_bank/filter_bank_n_init_sensitivity.csv
      - outputs/04_sliding/sliding_var_orders.csv
      - outputs/04_sliding/sliding_practical_metrics.csv
      - outputs/04_sliding/sliding_latency_heatmap.csv
      - outputs/04_sliding/sliding_phase_example.csv
      - outputs/04_sliding/sliding_forecast_example.csv
    params:
      - plots.forecast_zoom_start_s
      - plots.forecast_zoom_end_s
      - experiments.n_init_samples
      - experiments.n_init_samples_boxplot
      - experiments.score_curve_n_init_samples
      - sliding.forecast_example_latency_samples
      - tvd.fade_threshold_db
    plots:
      - results/figures
    outs:
      - results/csv_tables
