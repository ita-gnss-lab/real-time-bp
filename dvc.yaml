stages:
  get_dataset:
    cmd: uv run python -m real_time_bp.get_dataset
    params:
      - dataset.handle
      - dataset.output_dir
      - dataset.force_download
    outs:
      - data/raw/backpropagation
    always_changed: false

  dataset_summary:
    cmd: uv run python -m real_time_bp.get_dataset_summary
    deps:
      - real_time_bp/config.py
      - real_time_bp/get_dataset_summary.py
      - real_time_bp/stage_utils.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - data/raw/backpropagation
    params:
      - dataset
      - constants
      - experiments
    outs:
      - results/csv/01_dataset

  cycle_slip_results:
    cmd: uv run python -m real_time_bp.get_cycle_slip_results
    deps:
      - real_time_bp/config.py
      - real_time_bp/get_cycle_slip_results.py
      - real_time_bp/stage_utils.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/methodology/tvd.py
      - real_time_bp/representatives.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/parallel.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - data/raw/backpropagation
      - results/csv/01_dataset
    params:
      - dataset
      - runtime
      - constants
      - experiments
      - tvd
    outs:
      - results/csv/02_cycle_slips

  filter_bank_results:
    cmd: uv run python -m real_time_bp.get_filter_bank_results
    deps:
      - real_time_bp/config.py
      - real_time_bp/get_filter_bank_results.py
      - real_time_bp/stage_utils.py
      - real_time_bp/methodology/backpropagation.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/methodology/metrics.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/representatives.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/parallel.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - data/raw/backpropagation
      - results/csv/01_dataset
      - results/csv/02_cycle_slips
    params:
      - dataset
      - runtime
      - constants
      - experiments
    outs:
      - results/csv/03_filter_bank

  near_real_time_results:
    cmd: uv run python -m real_time_bp.get_near_real_time_results
    deps:
      - real_time_bp/config.py
      - real_time_bp/get_near_real_time_results.py
      - real_time_bp/stage_utils.py
      - real_time_bp/methodology/backpropagation.py
      - real_time_bp/methodology/constants.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/methodology/metrics.py
      - real_time_bp/methodology/near_real_time.py
      - real_time_bp/methodology/signal_model.py
      - real_time_bp/representatives.py
      - real_time_bp/utils/io.py
      - real_time_bp/utils/parallel.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - data/raw/backpropagation
      - results/csv/01_dataset
      - results/csv/02_cycle_slips
      - results/csv/03_filter_bank
    params:
      - dataset
      - runtime
      - constants
      - experiments
      - near_real_time
    outs:
      - results/csv/04_near_real_time

  result_plots:
    cmd: uv run python -m real_time_bp.get_results_plots
    deps:
      - real_time_bp/config.py
      - real_time_bp/get_results_plots.py
      - real_time_bp/representatives.py
      - real_time_bp/stage_utils.py
      - real_time_bp/methodology/filter_bank.py
      - real_time_bp/utils/params.py
      - real_time_bp/utils/progress.py
      - results/csv/01_dataset
      - results/csv/02_cycle_slips
      - results/csv/03_filter_bank
      - results/csv/04_near_real_time
    params:
      - plots
      - experiments
    plots:
      - results/figures
