dataset:
  handle: rodrigodlf/backpropagation
  output_dir: data/raw/backpropagation
  force_download: false

runtime:
  csv_chunksize: 75000
  csv_write_batch_rows: 50000
  # One process-pool size shared by TVD, filter-bank, and near-real-time stages.
  parallel_workers: 12

constants:
  speed_of_light_m_s: 299792458.0
  gps_l1_hz: 1575420000.0

quality_control:
  # Analysis guard: remove cases that lost carrier lock explicitly, plus cases
  # where hat_phi_s - phi_r contains a gross ramp even if the lock flag is false.
  exclude_loss_of_lock: true
  max_abs_diffractive_phase_slope_cycles_per_s: 0.5
  max_diffractive_phase_span_cycles: 100.0

experiments:
  # Paper: Results Section III.1; the dataset is stratified
  # by scintillation severity and carrier-to-noise ratio.
  severities:
    - weak
    - strong
  # Paper: Methodology Section II.4; N_init is the initial
  # segment used both to estimate T_F and to fit the VAR model.
  n_init_samples: 4096
  # Paper: Results Section III.2; this sweep justifies the fixed
  # N_init used in the remaining filter-bank/near-real-time experiments.
  n_init_sweep_samples:
    min: 512
    max: 16384
    step: 512
  n_init_samples_boxplot: 8192
  # Paper: Methodology Section II.4; candidate grid
  # T={T_F,1,...,T_F,P}, using the 0.5--2.0 s domain from the dataset design.
  tf_candidate_min_s: 0.5
  tf_candidate_max_s: 2.0
  tf_candidate_count: 72
  # Representative score-curve sweeps for Figure 2.
  score_curve_n_init_samples:
    - 1024
    - 2048
    - 4096
tvd:
  # Paper: Methodology Section II.2; TVD jumps are allowed only
  # at local fade minima below this intensity threshold.
  fade_threshold_db: -10.0
  # Paper: Breitsch's weighted TVD: low penalty at fade minima.
  allowed_jump_weight: 1.0
  # Paper: Breitsch's weighted TVD: high penalty elsewhere.
  blocked_jump_weight: 10000.0

near_real_time:
  # Paper: Methodology Section II.5; VAR order is selected by BIC over
  # this range for the real/imaginary scintillation features.
  var_order_min: 1
  var_order_max: 24
  # Paper: Results Section III.3, Figure 11; heatmap over
  # FFT length M and latency L / (M - M_c - 1).
  fft_m_values:
    min: 512
    max: 2048
    step: 128
  # Paper: Figure 11 varies L from 0 to M-M_c-1. Fractions compare latency
  # across different M without mixing incompatible absolute sample counts.
  heatmap_latency_fractions:
    min: 0.0
    max: 1.0
    step: 0.05
  # Full-time heatmap uses the lowest-C/N0 quality-passing cases per severity.
  heatmap_cases_per_severity: 1
  # Paper: Results Section III.3, Figure 12; practical operating
  # point used for the batch vs near-real-time comparison.
  practical_fft_m: 1024
  practical_latency_samples: 511
  residual_doppler_error_hz_min: 0.0
  residual_doppler_error_hz_max: 1.5
  residual_doppler_error_count: 16
  var_test_alpha: 0.05
  var_whiteness_test_lags: 24
  var_diagnostic_whiteness_lags:
    - 6
    - 12
    - 24
  var_diagnostic_plot_whiteness_lag: 24
  var_forecast_horizons_samples:
    - 1
    - 4
    - 16
    - 64
    - 256
  var_forecast_eval_samples: 32
  diagnostic_max_cases_per_severity: 1
  forecast_example_c_n0_db_hz: 35.0
  forecast_example_block_len: 8192
  forecast_example_latency_samples:
    - 0
  example_ml_configs:
    - block_len: 2048
      latency_samples: 0
    - block_len: 2048
      latency_samples: 512

plots:
  csv_dir: results/csv
  figures_dir: results/figures
  forecast_zoom_start_s: 310.0
  forecast_zoom_end_s: 370.0
  forecast_zoom_latency_samples: 0

representatives:
  # Change these ranks to inspect different representative examples. DVC only
  # needs to rerun the lightweight representative-results and plotting stages.
  case_rank_by_severity:
    weak: 2
    strong: 2
